name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  digital-pharmacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit (must report no vulnerabilities)
        run: npm audit --omit=dev

      - name: Full dependency audit (fail on high or critical)
        run: npm audit --audit-level=high

      - name: Lint (zero warnings)
        run: npm run lint

      - name: Digital pharmacy and server tests
        run: npm run test:server

      - name: Offline AI review evaluation (synthetic cases, mock only)
        run: npm run ai:evaluate

      - name: Frontend build (strict, warnings are errors)
        run: npm run build
        env:
          CI: true
