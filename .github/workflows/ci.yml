name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  simulation-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit (must report no vulnerabilities)
        run: npm audit --omit=dev

      - name: Full dependency audit (fail on high or critical)
        run: npm audit --audit-level=high

      - name: Lint (zero warnings)
        run: npm run lint

      - name: Simulation and server tests
        run: npm run simulation:test

      - name: Simulation demo
        run: npm run simulation:demo

      - name: Research reproduce (10 replicates, exact re-run of every metric)
        run: npm run research:reproduce
        env:
          REPLICATES: 10

      - name: Exact reproduce check of the latest stored experiment
        run: npm run research:reproduce -- --latest

      - name: Paper pipeline smoke run (few seeds)
        run: npm run paper:quick

      - name: Frontend build (strict, warnings are errors)
        run: npm run build
        env:
          CI: true

      - name: Upload simulation experiments artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulation-research-ci
          path: data/simulation-experiments/*.json
          if-no-files-found: ignore

  legacy-cdss-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Legacy prescription benchmark (not part of the research build)
        run: npm run evaluate:ablation
