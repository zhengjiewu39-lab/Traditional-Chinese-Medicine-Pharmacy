name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  simulation-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit (fail on high or critical)
        run: npm audit --audit-level=high

      - name: Lint (zero warnings)
        run: npm run lint

      - name: Simulation unit tests
        run: npm run simulation:test

      - name: Paper pipeline smoke run (few seeds)
        run: npm run paper:quick

      - name: Simulation demo
        run: npm run simulation:demo

      - name: Research reproduce (smoke)
        run: REPLICATES=3 npm run research:reproduce

      - name: Exact reproduce check
        run: npm run research:reproduce -- --latest
        continue-on-error: true

      - name: Frontend build (strict, warnings are errors)
        run: npm run build
        env:
          CI: true

      - name: Upload simulation experiments artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulation-research-ci
          path: data/simulation-experiments/*.json
          if-no-files-found: ignore

  legacy-cdss-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Legacy prescription benchmark (not research primary)
        run: npm run evaluate:ablation
        continue-on-error: true
